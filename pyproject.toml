[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-doc-assistant"
version = "0.1.0"
description = "Medical Document Assistant: medicine-label classifiers and document-grounded question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
    "ftfy>=6.3,<7",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "pyarrow>=17,<24",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34,<0.35",
    "streamlit>=1.45,<1.46",
    "python-multipart>=0.0.20,<0.0.21",
    "pypdf>=5.5,<5.6",
    "python-docx>=1.1,<1.2",
]
presentation = [
    "python-pptx>=1.0,<1.1",
    "reportlab>=4.4,<4.5",
]
browser = [
    "playwright>=1.55,<1.56",
]
nlp = [
    "transformers>=4.51,<4.52",
    "sentence-transformers>=3.4,<3.5",
    "huggingface-hub>=0.30,<0.34",
    "faiss-cpu>=1.11,<1.12",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=4.25,<6",
    "safetensors>=0.5,<0.6",
]
dl = [
    "torch>=2.7,<2.9",
]
ml = [
    "scikit-learn>=1.6,<1.8",
    "scipy>=1.11,<2",
    "joblib>=1.4,<2",
    "threadpoolctl>=3.1,<4",
]
notebooks = [
    "jupyterlab>=4.3,<5",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<0.11",
    "ipykernel>=6.29,<8",
]

[project.scripts]
medical-data = "medical_doc_assistant.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
